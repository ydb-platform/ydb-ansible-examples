
# YDB configuration options and their values
# are described in documentaion https://ydb.tech/en/docs/deploy/configuration/config

metadata:
  kind: MainConfig
  cluster: ""
  version: 0
config:
  yaml_config_enabled: true
  erasure: block-4-2
  bridge_config:
    piles:
    - name: dc1
    - name: dc2
  fail_domain_type: disk
  self_management_config: # automatic management of static resources (static group, state storage, etc)
    enabled: true
  default_disk_type: SSD # default disk type used for group creation of both kinds
  host_configs: # the list of available host configurations in the cluster.
  - host_config_id: 1
    drive:
    - path: /dev/disk/by-partlabel/ydb_disk_1    # path of the first disk in the host configration.
      type: SSD                                       # kind of the disk: available kinds are SSD, NVME, ROT
  hosts:
  - host: static-node-1.ydb-cluster.com  # storage node DNS name
    host_config_id: 1                 # numeric host configuration template identifier
    location:                   # this parameter describes where host is located.
      body: 1                         # string representing a host serial number.
      bridge_pile_name: dc1
      data_center: 'zone-a'           # string representing the datacenter / availability zone where the host is located.
  - host: static-node-2.ydb-cluster.com # storage node DNS name
    host_config_id: 1                 # numeric host configuration template identifier
    location:                   # this parameter describes where host is located.
      body: 2                         # string representing a host serial number.
      bridge_pile_name: dc1
      data_center: 'zone-a'           # string representing the datacenter / availability zone where the host is located.
  - host: static-node-3.ydb-cluster.com
    host_config_id: 1
    location:
      body: 3
      bridge_pile_name: dc1
      data_center: 'zone-a'
  - host: static-node-4.ydb-cluster.com
    host_config_id: 1
    location:
      body: 4
      bridge_pile_name: dc1
      data_center: 'zone-a'
  - host: static-node-5.ydb-cluster.com
    host_config_id: 1
    location:
      body: 5
      bridge_pile_name: dc1
      data_center: 'zone-a'
  - host: static-node-6.ydb-cluster.com
    host_config_id: 1
    location:
      body: 6
      bridge_pile_name: dc1
      data_center: 'zone-a'
  - host: static-node-7.ydb-cluster.com
    host_config_id: 1
    location:
      body: 7
      bridge_pile_name: dc1
      data_center: 'zone-a'
  - host: static-node-8.ydb-cluster.com
    host_config_id: 1
    location:
      body: 8
      bridge_pile_name: dc1
      data_center: 'zone-a'
  - host: static-node-9.ydb-cluster.com
    host_config_id: 1
    location:
      body: 9
      bridge_pile_name: dc2
      data_center: 'zone-b'
  - host: static-node-10.ydb-cluster.com
    host_config_id: 1
    location:
      body: 10
      bridge_pile_name: dc2
      data_center: 'zone-b'
  - host: static-node-11.ydb-cluster.com
    host_config_id: 1
    location:
      body: 11
      bridge_pile_name: dc2
      data_center: 'zone-b'
  - host: static-node-12.ydb-cluster.com
    host_config_id: 1
    location:
      body: 12
      bridge_pile_name: dc2
      data_center: 'zone-b'
  - host: static-node-13.ydb-cluster.com
    host_config_id: 1
    location:
      body: 13
      bridge_pile_name: dc2
      data_center: 'zone-b'
  - host: static-node-14.ydb-cluster.com
    host_config_id: 1
    location:
      body: 14
      bridge_pile_name: dc2
      data_center: 'zone-b'
  - host: static-node-15.ydb-cluster.com
    host_config_id: 1
    location:
      body: 15
      bridge_pile_name: dc2
      data_center: 'zone-b'
  - host: static-node-16.ydb-cluster.com
    host_config_id: 1
    location:
      body: 16
      bridge_pile_name: dc2
      data_center: 'zone-b'
  actor_system_config:          # the configuration of the actor system which descibes how cores of the instance are distributed
    use_auto_config: true       # accross different types of workloads in the instance.
  interconnect_config:
    start_tcp: true
    encryption_mode: OPTIONAL
    path_to_certificate_file: "/opt/ydb/certs/node.crt"
    path_to_private_key_file: "/opt/ydb/certs/node.key"
    path_to_ca_file: "/opt/ydb/certs/ca.crt"
  grpc_config:
    cert: "/opt/ydb/certs/node.crt"
    key: "/opt/ydb/certs/node.key"
    ca: "/opt/ydb/certs/ca.crt"
    services_enabled:
    - legacy
    - discovery
  security_config:
    enforce_user_token_requirement: true
    monitoring_allowed_sids:
    - "root"
    - "ADMINS"
    - "DATABASE-ADMINS"
    administration_allowed_sids:
    - "root"
    - "ADMINS"
    - "DATABASE-ADMINS"
    viewer_allowed_sids:
    - "root"
    - "ADMINS"
    - "DATABASE-ADMINS"
    register_dynamic_node_allowed_sids:
    - databaseNodes@cert
    - root@builtin
    bootstrap_allowed_sids:
    - "root"
    - "ADMINS"
    - "DATABASE-ADMINS"
  client_certificate_authorization:
    request_client_certificate: true
    client_certificate_definitions:
        - member_groups: ["ADMINS"]
          subject_terms:
          - short_name: "O"
            values: ["YDB"]
        - member_groups: ["databaseNodes@cert"]
          subject_terms:
          - short_name: "O"
            values: ["YDB"]
selector_config:
- config:
    actor_system_config: !inherit
      cpu_count: 2
      node_type: COMPUTE
  description: Actorsystem for database nodes
  selector:
    dynamic: true
- config:
    actor_system_config: !inherit
      cpu_count: 2
      node_type: STORAGE
  description: Actorsystem for storage nodes
  selector:
    dynamic: false
